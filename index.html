<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тимур — преподаватель китайского языка</title>
<meta name="description" content="Уже через месяц занятий вы прочитаете свой первый китайский комикс. Онлайн-уроки китайского языка. Пробный урок бесплатно.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header class="nav">
  <div class="nav__inner container">
    <a class="nav__brand" href="#hero">
      <span class="nav__brand-cn">中文</span>
      <span class="nav__brand-text">Тимур · преподаватель китайского</span>
    </a>
    <nav class="nav__links">
      <a href="#method">Методика</a>
      <a href="#results">Результаты</a>
      <a href="#reviews">Отзывы</a>
      <a href="#prices">Цены</a>
      <a class="btn btn--sm btn--dark" href="#booking">Пробный урок</a>
    </nav>
  </div>
</header>

<main>

  <!-- ============ 1. HERO ============ -->
  <section id="hero" class="hero" data-screen-label="Hero">
    <!-- Этап 1.1 -->
  </section>

  <!-- ============ 2. ПРАКТИКА С НОСИТЕЛЕМ ============ -->
  <section id="native" class="native" data-screen-label="Практика с носителем">
    <!-- Этап 1.4 -->
  </section>

  <!-- ============ 3. О ПРЕПОДАВАТЕЛЕ ============ -->
  <section id="about" class="about" data-screen-label="О преподавателе">
    <!-- Этап 1.3 -->
  </section>

  <!-- ============ 4. МЕТОДИКА ============ -->
  <section id="method" class="method" data-screen-label="Методика">
    <!-- Этап 1.5 -->
  </section>

  <!-- ============ 5. ТЕХНОЛОГИИ ============ -->
  <section id="tech" class="tech" data-screen-label="Технологии">
    <!-- Этап 1.9 -->
  </section>

  <!-- ============ 6. РЕЗУЛЬТАТЫ ============ -->
  <section id="results" class="results" data-screen-label="Результаты">
    <!-- Этап 1.7 -->
  </section>

  <!-- ============ 7. ОТЗЫВЫ ============ -->
  <section id="reviews" class="reviews" data-screen-label="Отзывы">
    <!-- Этап 1.8 -->
  </section>

  <!-- ============ 8. ЦЕНЫ ============ -->
  <section id="prices" class="prices" data-screen-label="Цены">
    <!-- Этап 1.6 -->
  </section>

  <!-- ============ 9. БРОНИРОВАНИЕ ============ -->
  <section id="booking" class="booking" data-screen-label="Бронирование">
    <!-- Этап 1.10 (вёрстка) → Этап 3 (интеграция с API teacher-bot) -->
  </section>

  <!-- ============ 10. ФИНАЛЬНЫЙ CTA ============ -->
  <section id="cta" class="cta" data-screen-label="Финальный CTA">
    <!-- Этап 1.2 -->
  </section>

</main>

<script src="js/animations.js" defer></script>
<script src="js/booking.js" defer></script>
</body>
</html>
